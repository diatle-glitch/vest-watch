name: Refresh on-chain data

on:
  schedule:
    # GitHub drops many sub-hourly schedule slots under load, including on an
    # active workflow. The cron stays as a backup. The re-arm step below is the
    # cadence that keeps runs coming when a slot is skipped.
    # Re-saved by the repo owner so the schedule registers under a user account.
    - cron: "9,29,49 * * * *"
  workflow_dispatch:
  # A change to this file also starts a run. Data commits do not match this path,
  # so the job does not retrigger itself. GITHUB_TOKEN pushes do not start
  # workflow runs except workflow_dispatch, which the re-arm step uses.
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: vest-watch-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch balances and transfers
        run: python3 scripts/fetch.py

      - name: Commit data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/flows.json data/transfers.json data/sync.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "Update on-chain USDC snapshot"
          git push

      - name: Re-arm the refresh if nothing is queued
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sub-hourly cron on this repo has been registered and has fired, but
          # most 20-minute slots never start. Wait, then dispatch this workflow
          # on main unless a run is already queued (a cron that landed during
          # the wait, or another dispatch). The concurrency group serializes them.
          echo "Waiting 12 minutes before checking the queue"
          sleep 720
          queued=$(gh run list --workflow refresh.yml --limit 30 --json status,databaseId \
            --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          echo "queued_or_pending=$queued"
          if [ "$queued" != "0" ]; then
            echo "A run is already queued; not dispatching"
            exit 0
          fi
          gh workflow run refresh.yml --ref main
