<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vest USDC monitor</title>
  <meta name="description" content="Public on-chain USDC balances and transfers for a monitored set of wallets associated with Vest Markets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <p class="eyebrow">On-chain USDC</p>
        <h1>Vest wallets</h1>
      </div>
      <p class="updated" id="updated">Loading snapshot…</p>
    </div>
  </header>
  <main id="app" class="wrap">
    <p class="loading">Loading public on-chain data…</p>
  </main>
  <footer class="wrap">
    <p>Data from public blockchains. Not financial advice. Not affiliated with Vest Markets.</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
